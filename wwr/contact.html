<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Rafting Río Bueno</title>
    <meta name="description"
      content="Page about contact for rafting route from Lake Ranco to the Bueno River">
    <meta name="author" content="Pablo Exequiel Hermosilla Fourcade">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logotipo.png" alt="logotipo" width="150">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="rafting">
            <h1>Rafting Río Bueno Company</h1>
            <p>Sector Puerto Lapi Ruta T-755</p>
            <p>Ignao, Lago Ranco</p>
            <p>+ 56 9 8245 6785</p>
            <p>info@raftingcompany.com</p>
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d36999.74313606786!2d-72.57960520302437!3d-40.28230679312998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2scl!4v1780621093050!5m2!1ses-419!2scl"
              width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>


            <form>
                <div class="form-item column2">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-item column2">
                    <label for="email">Email:</label>
                    <input type="email" id="name" name="name" required>
                </div>
                <div class="form-item column2">
                    <label for="message">Message Purpose:</label>

                    <input type="radio" id="message" name="message" required>
                    <label for="general">General Inquiry</label>

                    <input type="radio" id="message" name="message" required>
                    <label for="reservation">Reservation Question</label>

                    <input type="radio" id="message" name="message" required>
                    <label for="website">Website Suggestion</label>
                </div>
                <div class="form-item column3">
                    <label for="feedback">Message:</label>
                    <textarea id="feedback" name="feedback" rows="4"
                      placeholder="type here"></textarea>
                </div>
                <div class="form-item column1">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please Subscribe me to the monthyly newsletter</label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="serve">
            <h2>We Are Here To Serve You</h2>
            <figure>
                <img src="images/guide.jpg" alt="image 01">
                <figcaption>Rafting Guide</figcaption>
            </figure>
            <figure>
                <img src="images/safety.jpg" alt="image 02">
                <figcaption>Safety Kayaker</figcaption>
            </figure>
            <figure>
                <img src="images/trip_leader.jpg" alt="image 03">
                <figcaption>Trip Leader</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>©2026 | Rafting Río Bueno | Pablo Hermosilla</p>
        <nav class="socialmedia">
            <a href=""><img src="images/facebook_icon.svg" alt="Facebook Icon" width="40"></a>
            <a href=""><img src="images/instagram_icon.svg" alt="instagram Icon" width="40"></a>
            <a href=""><img src="images/whatsapp_icon.svg" alt="whatsapp Icon" width="40"></a>
        </nav>
    </footer>
</body>

</html>
